  # ================================================================
  # 阶段 5：榜单对比 + 答案层断言
  #
  # 这两条故意不写 `expected` —— 判据完全在答案正文上。
  # 榜单对比的"正确答案"不是某个数，而是「谁升谁降、谁掉榜」这几句话；
  # 用 SQL 返回列去判它，只能判到"榜首播放量"，判不到"名次有没有算对"。
  #
  # 期望值由独立 SQL 实测（2026-11-10），与 Agent 输出无关：
  #   上周(11-02~11-08)      榜首 S000014 = 1994
  #   上上周(10-26~11-01)    榜首 S000014 = 1997
  #   S001320  上上周第 11(492) → 上周第 9(512)
  #   S000447  上上周第 9(541)  → 上周第 10(495)
  #   S000669  上上周第 10(503) → 上周第 11(455)，掉出前 10
  #   两周参与排名实体均为 1486
  # ================================================================

  - id: C37
    type: value
    domain: 内容消费
    intent: 对比
    question: "上周播放量 Top10 和上上周相比，名次有哪些变化"
    # 答案层断言：名次表出现了、榜首值对、有人上升 2 位、掉榜被点名。
    # 刻意**不绑 song_id**：同一个问题，模型这次可能 JOIN 出 song_name、
    # 下次只给 song_id。断言绑内部标识，换一种（同样正确的）SQL 就会假红——
    # 这正是旧判据"跟着 SQL 返回形状走"的毛病，不能在新判据里重犯。
    answer_must:
      - "名次变化"
      - {value: 1994, near: 榜首}
      - "↑2"
      - "掉出前 10"
    # 静默降级是这条题最该防的失败：结果表还在、数字也在，
    # 只有"名次变化"那一节悄悄没了。
    answer_must_not:
      - "未自动计算"
      - "无法做名次对比"
    tags: [排名, 榜单对比, 名次变化, 答案层]

  - id: C38
    type: value
    domain: 用户增长
    intent: 对比
    question: "上周播放量最高的 5 个省份，和上上周相比排名有变化吗"
    # 这一条是"没变化"的样本：前 5 名原封不动，但值都变了。
    # 只判"名次变化"节出现会漏掉半成品，所以要求统计行与实体名都在——
    # 实体是「广东省」而不是某个 id，维度类榜单的可读性也一并验了。
    answer_must:
      - "名次变化"
      - "持平"
      - "广东省"
    answer_must_not:
      - "未自动计算"
      - "无法做名次对比"
    tags: [对比, 榜单对比, 维度对比, 答案层]

  - id: K01
    type: value
    domain: 用户增长
    intent: 对比
    question: "2026-11-08 的 DAU 比 11-07 多了多少"
    # 阶段 6：口径一致性。SQL 里多了一个系统平移不认识的日期写法（YYYYMMDD），
    # 基线那条 SQL 的这一处不会被改，两边就不再是"同一口径的两个窗口"。
    # 期望行为是**不给差值**并说明原因——而不是硬算一个偏了味的数。
    # 这条用固定 SQL + 零 LLM，所以每次跑结果一致：它验的是判断逻辑，不是模型发挥。
    sql: "SELECT COUNT(DISTINCT user_id) AS c FROM dwd_session WHERE dt = '2026-11-08' AND date_format(dt, '%Y%m%d') = '20261108'"
    answer_must:
      - "不给差值"
    answer_must_not:
      - "差值 +"
      - "差值 -"
    tags: [对比, 口径一致, 零LLM, 答案层]

  - id: K02
    type: refuse
    domain: 边界与安全
    intent: 成本闸
    question: "2026-11-08 全部事件的条数是多少"
    # 阶段 8：成本闸（AC-17）。故意写一个"有 dt 但裁不掉分区"的 SQL——
    # 护栏 R6 是列级存在性检查，看见 dt 就放行；EXPLAIN 才说出真话：
    # 35/35 个分区、499 万行、202MB。期望是**拦下不执行**并说明原因，
    # 而不是硬扫一遍再慢慢返回（那既不省成本，也让"闸"名不副实）。
    # 固定 SQL + 零 LLM，所以每跑一次结果都一样：验的是判据，不是模型发挥。
    sql: "SELECT COUNT(*) AS c FROM ods_music_event WHERE dt <> '1900-01-01'"
    expect_reason: "成本闸"
    answer_must:
      - "成本闸"
      - "35/35"
      - "4,994,396"
    answer_must_not:
      - "全部事件的条数是"
    tags: [边界, 成本闸, 零LLM, 答案层]



