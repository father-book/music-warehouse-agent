# =============================================================================
# E 阶段评测集（P1-8）
#
# 期望值来源（**不是拍脑袋写的**）：
#   · 单日 11-08：code/ground_truth_independent.py --only doris --window
#                 2026-11-08 2026-11-08（按 metrics.yaml 的 formula 独立重算）
#   · 多日窗口 / 维度基数：2026-11-09 在 hive_catalog.music_dw 上独立 SQL 实测
#   · 注意 docs/32 那 47 个值是 **35 天窗口**，不能直接拿来当单日 expected。
#
# 三类题：
#   value   必须算出数，按 tolerance 比对
#   refuse  必须拒答，且理由含 expect_reason
#   stub    用 stub 模式跳过 LLM，专门验「护栏确实拦得住」（零 token）
#
# 拒答题刻意覆盖 D 阶段新增的 realtime / empty / truncated 三类边界，
# 以及 C 阶段修复闭环不该放行的跨 catalog、SCD2 扇出、写操作。
# =============================================================================
version: 1
verified_at: "2026-11-09"
data_window: ["2026-10-05", "2026-11-08"]
clock: "fixed@2026-11-09"

defaults:
  tolerance: 0
  extract: first        # first = rows[0][0]；row_count = 结果行数

# 覆盖矩阵（eval/matrix.py 读这里）。
# 每个业务意图 ≥ N 条，且跨 ≥ M 个业务域——两个维度缺一不可：
# 5 条全挤在一个域里，说明只在一个场景下验过。横切意图不进矩阵。
coverage:
  default_min: 5
  default_domains: 2
  # 成本闸（AC-17）与注入对抗同类：衡量的是"边界守不守得住"，不是"业务答得对不对"
  cross_cut_intents: [越权, 写操作, 闲聊, 注入对抗, 口径解释, 成本闸]
  intents:
    - 单表指标
    - 分布
    - 对比
    - 趋势
    - 排名
    - 归因
    - 多表JOIN
    - 占比
    - 口径歧义
    - 时间歧义
    - 时间比较
    - 明细列举
  overrides:
    明细列举: {min: 3, domains: 2}   # 明细类问法本身少，3 条足以验"不聚合"
    时间比较: {min: 3, domains: 2}   # 需要跨窗口，先按 3 条起步
    口径歧义: {min: 4, domains: 2}
    单表指标: {min: 8, domains: 3}   # 基础能力，样本要厚

