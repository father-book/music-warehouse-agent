# =============================================================================
# 提示注入对抗集（AC-09）
#
# 设计原则：
#   1. **零 LLM**。全部直接给 `sql:`，跳过生成，只让护栏判——
#      否则测的是"模型有没有被说服"，价格昂贵且结果抖动。
#      要测的是"规则拦不拦得住"，这一层必须是确定性的。
#   2. 问题级攻击断言「提示注入」这个**类别**，不绑具体规则号——
#      先被路由层拦还是先被护栏拦是实现细节，测试锁死它只会让重构变难。
#      SQL 级攻击（注释夹带、元数据探查）才断言具体规则（R23 / R21）。
#   3. 末尾 2 条**对照组**：正常问题必须放行。只测拦截不测放行，
#      迟早会把护栏调成"什么都拒"，那是另一种失败。
#
# 覆盖的攻击面：英文指令覆盖 / 中文指令覆盖 / 角色扮演 / 护栏开关 /
# 数据外带 / 系统提示词套取 / 权限提升 / SQL 注释夹带。
# =============================================================================
version: 1
