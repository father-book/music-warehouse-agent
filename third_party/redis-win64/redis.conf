# 项目自带 Redis 的配置（Microsoft Redis for Windows 3.2.100 移植版）
#
# 这份配置是给「答案缓存」用的，不是通用 Redis 部署配置：
# 只需要 GET/SET/DEL/SCAN/INFO，不需要持久化、不需要集群。
#
# 启动方式（不要直接双击 exe，走脚本才会补上密码和日志目录）：
#     python code/agent/run_redis.py
#
# ---- 网络：只监听本机 ----
# 绑 0.0.0.0 就是把一个无密码的 Redis 暴露到局域网，是最常见的挖矿入口。
bind 127.0.0.1
protected-mode yes
port 6379
timeout 0
tcp-keepalive 60

# ---- 持久化：关掉 ----
# 缓存的正确语义是「丢了就重新算」，不是「丢了算故障」。
# 开着 RDB 会每隔几分钟 fork 一次写 dump.rdb，对一个纯缓存毫无收益，
# 还会把带权限信息的答案落到磁盘上（policy 已进 key，但值里含数据）。
save ""
appendonly no

# ---- 内存：给个上限，避免无限涨 ----
# 512MB 对答案缓存足够（单条约几十 KB，含 gzip）。
# allkeys-lru：满了就淘汰最久没用的，不需要问后端。
maxmemory 512mb
maxmemory-policy allkeys-lru

# ---- 日志 ----
# 空 = 输出到标准输出，由 run_redis.py 重定向到 .run/redis/redis.log
logfile ""
loglevel notice

databases 16
